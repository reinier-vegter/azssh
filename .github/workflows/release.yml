name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Linux binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="azssh_${VERSION}_${os}_${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "dist/${name}" ./cmd/azssh
          done
          for image in ubuntu:22.04 registry.access.redhat.com/ubi8/ubi-minimal; do
            docker run --rm \
              --mount "type=bind,src=${PWD}/dist/azssh_${VERSION}_linux_amd64,dst=/usr/local/bin/azssh,readonly" \
              "$image" /usr/local/bin/azssh --version
          done
          gzip -9 -n dist/azssh_*
          (cd dist && sha256sum *.gz > SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.gz dist/SHA256SUMS --generate-notes
